defaults:
  # 1 素材语言：页面默认英语；按列表勾选（可多选）
  material_language:
    - 英语

  # 2 轮播图：打开素材中心上传。pack=图片包内文件，按 files 顺序取前 count 张；files 为空则按目录排序
  images:
    # 图片包根目录（相对项目根目录）
    # 具体本地图片包由每次任务注入，轮播图、预览图和素材图均使用图片包中的本地文件

    task_injected: true

    pack_dir: "D:/project/temu-listing-ops/data/image-packs/手机壳一/990f6b43c33d"
    carousel:
      count: 5
      source: pack
    # 详情图文装修：每个“图片”组件从素材中心选择一张 carousel 素材
    detail:
      enabled: true
      source: carousel
      count: 5
      files: []
    # 3 商品素材图：必传，但第二步后 Temu 同步，skip 表示插件不点
    material:
      skip: true
      count: 1
      source: pack
    # 8 外包装图片：点「批量上传」传本地图
    package_outer: "D:/project/temu-listing-ops/data/waibaozhuang-goods.JPEG"

  # 4 商品名称：品牌和材质运行时匹配，描述由 AI 根据图片特征生成。
  title:
    template: "适用于{brand}手机壳{material}{craft_codes}{desc}保护壳"
    desc:
      source: ai
      max_chars: 24
      prompt: "根据商品图片提取外观和设计特征，输出适合手机壳标题的简短中文描述；只输出短语，不要品牌、型号、材质、颜色、编码、标点或解释。"

  # 5 商品产地：级联时按 country → region 分步选
  origin:
    country: 中国大陆
    region: 广东

  # 6 商品属性
  attributes:
    # Temu 的“主要材质”独立于 material_codes，始终选择页面候选 PC。
    main_material: PC

  # 7 商品规格（手机型号、颜色必填）
  specs:
    static:

  # 8 包装类型/形状；图片路径见 images.package_outer
  packaging:
    type: 软包装+硬物
    shape: 长方体

  # 9 敏感属性全部选「否」；体积与重量只填数字
  sensitive:
    all: 否
  volume:
    longest_cm: 15
    middle_cm: 8
    shortest_cm: 1
  weight_g: 17

  sku:
    customized: 非定制商品
    preview: carousel_first
    classification: 单品
    # 单品分类页面会显示“共计内含”，但本商品不填写该字段
    fill_total_contents: false


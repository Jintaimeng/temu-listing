# 图片包首图材质编码规则：首图文件名末尾三位数字必须与 SKU 前三位一致。
material_image_rule:
  enabled: true
  code_length: 3
  sku_prefix_length: 3
  filename_suffix_pattern: '(\d{3})$'
  carousel_count: 5

# 上架表单配置。中枢入队/领取时读取，插件按 resolved 字段填表。
# 基本信息填写顺序与下方 defaults 分段一致（1–9）；SKU/提交等后续步骤稍后补。
# 每个品牌单独创建一个商品草稿；同一 pack_dir 图片包按 brands 顺序复用。
# 手机型号、SKU 货号、申报价格、建议零售价及币种统一从 brands[].phone_models 解析。
# 手机型号匹配大小写不敏感；找不到明确规则时停止上架，不猜填货号或价格。


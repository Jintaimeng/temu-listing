defaults:
  # 1 素材语言：页面默认英语；按列表勾选（可多选）
  material_language:
    - 英语

  # 2 轮播图：打开素材中心上传。pack=图片包内文件，按 files 顺序取前 count 张；files 为空则按目录排序
  images:
    # 图片包根目录（相对项目根目录）
    # 具体本地图片包由每次任务注入，轮播图、预览图和素材图均使用图片包中的本地文件

    task_injected: true

    pack_dir: null
    carousel:
      count: 5
      source: pack
    # 详情图文装修：每个“图片”组件从素材中心选择一张 carousel 素材
    detail:
      enabled: true
      source: carousel
      count: 5
      files: []
    # 3 商品素材图：必传，但第二步后 Temu 同步，skip 表示插件不点
    material:
      skip: true
      count: 1
      source: pack
    # 8 外包装图片：点「批量上传」传本地图
    package_outer: "D:/project/temu-listing-ops/data/waibaozhuang-goods.JPEG"

  # 4 商品名称：适用于{brand}的手机壳{desc}保护壳。desc.source=static 先用下面的词；ai 预留给之后
  title:
    template: "{brand}"
    # {brand} 在处理每个 brands 条目时替换，模板本身必须保留该占位符
    desc:
      source: static
      static: ""

  # 5 商品产地：级联时按 country → region 分步选
  origin:
    country: 中国大陆
    region: 广东

  # 6 商品属性
  attributes:
    # 主要材质由 brands[].material 与图片包首图材质编号动态填入

  # 7 商品规格（手机型号、颜色必填）
  specs:
    static:

  # 8 包装类型/形状；图片路径见 images.package_outer
  packaging:
    type: 软包装+硬物
    shape: 长方体

  # 9 敏感属性全部选「否」；体积与重量只填数字
  sensitive:
    all: 否
  volume:
    longest_cm: 15
    middle_cm: 8
    shortest_cm: 1
  weight_g: 17

  sku:
    customized: 非定制商品
    preview: carousel_first
    classification: 单品
    # 单品分类页面会显示“共计内含”，但本商品不填写该字段
    fill_total_contents: false

